name: Deploy Automático na VPS

on:
  push:
    branches: [ main ] # Se o seu ramo principal for 'master', mude aqui para 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Executar Deploy na VPS via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /opt/WebApp-Agenda-Estilo
          git pull origin main
          npm install
          npm run build
          pm2 restart agendaestilo