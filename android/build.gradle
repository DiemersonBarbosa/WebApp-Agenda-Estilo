buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'
    }
}

ext {
    minSdkVersion = 24
    compileSdkVersion = 34
    targetSdkVersion = 34
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    coreSplashScreenVersion = '1.0.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Força versões de dependências compatíveis com SDK 34
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.12.0'
            force 'androidx.core:core-ktx:1.12.0'
            force 'androidx.activity:activity:1.8.2'
            force 'androidx.activity:activity-ktx:1.8.2'
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Converte automaticamente o 'package' do AndroidManifest.xml em 'namespace' para plugins do Capacitor
subprojects { project ->
    project.pluginManager.withPlugin('com.android.library') {
        if (!project.android.hasProperty('namespace') || project.android.namespace == null) {
            def manifestFile = project.file('src/main/AndroidManifest.xml')
            if (manifestFile.exists()) {
                def manifestXml = new XmlParser().parse(manifestFile)
                def packageName = manifestXml.attribute('package')
                if (packageName) {
                    project.android.namespace = packageName
                } else {
                    project.android.namespace = "com.agendaestilo.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
                }
            }
        }
    }
}